<svg xmlns="http://www.w3.org/2000/svg" width="800" height="372" viewBox="0 0 800 372" role="img" aria-label="Status card">
  <defs>
    <clipPath id="clip"><rect x=".5" y=".5" width="799" height="371" rx="16"/></clipPath>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".07"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    
    .in { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .fill { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
            animation: grow 1.6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.6s ease-out infinite; }
    @keyframes ring { 0% { opacity: .5; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(3); } }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateY(-90px); } to { transform: translateY(372px); } }
    @media (prefers-reduced-motion: reduce) {
      .in { animation: none; }
      .fill { animation: none; transform: none; }
      .ring, .scan { display: none; }
    }
    
  </style>
  <rect x=".5" y=".5" width="799" height="371" rx="16" fill="#000000" stroke="#1f1f1f"/>
  <text x="44" y="82" font-size="12" fill="#7a7a7a" class="in" style="animation-delay:0.15s">graduation</text><text x="41" y="172" font-size="96" font-weight="300" letter-spacing="-3" fill="#f2f2f2" class="in" style="animation-delay:0.30s">201</text><text x="44" y="200" font-size="13" fill="#7a7a7a" class="in" style="animation-delay:0.45s">days to go</text><rect x="44" y="228" width="232" height="2" rx="1" fill="#242424"/><rect class="fill" style="animation-delay:.6s" x="44" y="228" width="198.67" height="2" rx="1" fill="#f2f2f2"/><text x="44" y="252" font-size="12" fill="#7a7a7a" class="in" style="animation-delay:0.70s">86% of the degree</text><text x="44" y="270" font-size="12" fill="#4d4d4d" class="in" style="animation-delay:0.80s">aug 2023 – may 2027</text><line x1="304" y1="52" x2="304" y2="320" stroke="#171717"/><g class="in" style="animation-delay:0.25s"><text x="344" y="82" font-size="12" fill="#7a7a7a">building</text><text x="344" y="104" font-size="15" fill="#f2f2f2">a failure triage for github logs</text><line x1="344" y1="118" x2="756" y2="118" stroke="#171717"/></g><g class="in" style="animation-delay:0.37s"><text x="344" y="134" font-size="12" fill="#7a7a7a">learning</text><text x="344" y="156" font-size="15" fill="#f2f2f2">reinforcement learning · ROS navigation</text><line x1="344" y1="170" x2="756" y2="170" stroke="#171717"/></g><g class="in" style="animation-delay:0.49s"><text x="344" y="186" font-size="12" fill="#7a7a7a">class of</text><text x="344" y="208" font-size="15" fill="#f2f2f2">2027 · B.Tech CS (AI &amp; Robotics) · VIT Chennai</text><line x1="344" y1="222" x2="756" y2="222" stroke="#171717"/></g><g class="in" style="animation-delay:0.61s"><text x="344" y="238" font-size="12" fill="#7a7a7a">status</text><circle cx="348" cy="255" r="4" fill="#f2f2f2"/><circle class="ring" cx="348" cy="255" r="4" fill="none" stroke="#f2f2f2" stroke-width="1"/><text x="362" y="260" font-size="15" fill="#f2f2f2">open to internships &amp; roles</text><line x1="344" y1="274" x2="756" y2="274" stroke="#171717"/></g><g class="in" style="animation-delay:0.73s"><text x="344" y="290" font-size="12" fill="#7a7a7a">contact</text><text x="344" y="312" font-size="15" fill="#f2f2f2">github.com/Asmitcod</text></g><line x1="44" y1="334" x2="756" y2="334" stroke="#171717"/><g class="in" style="animation-delay:0.90s"><text x="44" y="358" font-size="11" fill="#4d4d4d">asmitcod</text><text x="756" y="358" text-anchor="end" font-size="11" fill="#4d4d4d">synced 2026-11-11</text></g><g clip-path="url(#clip)" pointer-events="none"><g class="scan"><rect x="0" y="0" width="800" height="90" fill="url(#trail)"/><rect x="0" y="89" width="800" height="1" fill="#ffffff" fill-opacity=".22"/></g></g>
</svg>
