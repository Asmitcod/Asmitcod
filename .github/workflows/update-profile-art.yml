
name: Update GitHub Profile Art

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch GitHub contributions
        env:
          GH_PROFILE_USER: Asmitcod
        run: |
          python scripts/fetch_contributions.py

      - name: Generate neotechinfo card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/make_info_card.py

      - name: Render contribution heatmap
        run: |
          python scripts/render_heatmap.py

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/contributions.json
          git add info-card.svg
          git add contrib-heatmap.svg

          git diff --cached --quiet || git commit -m "Update GitHub profile art"

          git push origin HEAD:${GITHUB_REF_NAME}
