name: Update contribution city

on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours
  workflow_dispatch:             # "Run workflow" button
  push:
    branches: [main]
    paths:
      - "scripts/make_city.py"
      - ".github/workflows/update-city.yml"

permissions:
  contents: write

concurrency:
  group: update-city
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1) refresh data/contributions.json (your existing script)
      - name: Fetch contributions
        env:
          GH_USER: Asmitcod
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      # 2) your existing heatmap step stays as it is, e.g.:
      # - name: Build heatmap
      #   run: python scripts/<your-heatmap-script>.py

      # 3) NEW: build the 3D city (stdlib only, no pip install)
      - name: Build contribution city
        env:
          GH_USER: Asmitcod
        run: python scripts/make_city.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-city.svg data/contributions.json
          # also add contrib-heatmap.svg here if your other workflow doesn't commit it
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update contribution city"
            git pull --rebase origin main
            git push
          fi